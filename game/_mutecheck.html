<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<title>声音开关 · 实机视口检查</title>
<style>
  body{margin:0;background:#e9e4d8;font:12px/1.4 -apple-system,"PingFang SC","Noto Sans SC",sans-serif;color:#3b352c}
  .row{display:flex;gap:18px;padding:16px;align-items:flex-start}
  .col{display:flex;flex-direction:column;gap:6px}
  .lab{font-weight:600;letter-spacing:.08em}
  iframe{border:0;background:#fff;box-shadow:0 6px 20px -10px rgba(0,0,0,.4);display:block}
  .m{font-size:11px;color:#6f6555}
</style>
</head>
<body>
<div class="row">
  <div class="col"><span class="lab">iPhone 14 · 390×844</span>
    <iframe id="f390" src="/game/?v=mcheck1" width="390" height="844"></iframe>
    <span class="m" id="m390">…</span></div>
  <div class="col"><span class="lab">窄屏 · 360×740</span>
    <iframe id="f360" src="/game/?v=mcheck1" width="360" height="740"></iframe>
    <span class="m" id="m360">…</span></div>
  <div class="col"><span class="lab">桌面 1280×800</span>
    <iframe id="f1280" src="/game/?v=mcheck1" width="1280" height="800"></iframe>
    <span class="m" id="m1280">…</span></div>
</div>
<script>
function report(id, out){
  var f=document.getElementById(id), d=null;
  try{ d=f.contentDocument; }catch(e){ document.getElementById(out).textContent='cross-origin'; return; }
  if(!d||!d.documentElement){ document.getElementById(out).textContent='not ready'; return; }
  var de=d.documentElement, b=d.body;
  var btn=d.getElementById('btnVol'), st=d.getElementById('stage');
  var s='scrollW='+de.scrollWidth+' clientW='+de.clientWidth+' scrollH='+de.scrollHeight+' clientH='+de.clientHeight;
  if(btn&&st){
    var rb=btn.getBoundingClientRect(), rs=st.getBoundingClientRect();
    s+=' | btn='+Math.round(rb.width)+'×'+Math.round(rb.height)+' at '+Math.round(rb.left-rb.left)+','+Math.round(rb.top-rs.top);
    s+=' | insideStage='+(rb.right<=rs.right+0.5&&rb.bottom<=rs.bottom+0.5);
    s+=' | label='+btn.textContent.trim();
    // 是否被别的元素盖住：取按钮中心点最顶层的元素
    var el=d.elementFromPoint(rb.left+rb.width/2, rb.top+rb.height/2);
    s+=' | topmost='+(el?(el.id||el.className||el.tagName):'none');
    s+=' | jsErr='+(de.getAttribute('data-js-err')||'none');
  }else{ s+=' | btn missing'; s+=' | jsErr='+(de.getAttribute('data-js-err')||'none'); }
  document.getElementById(out).textContent=s;
}
function all(){ ['f390','f360','f1280'].forEach(function(f,i){ report(f,['m390','m360','m1280'][i]); }); }
setTimeout(all,2500); setTimeout(all,5000);
</script>
</body>
</html>
