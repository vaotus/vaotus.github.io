<body>
<div class="app" id="app">

      <span class="chip" id="chipDay">第 1 天</span>
    </div>
  </header>

  <main class="stage" id="stage">
    <canvas id="cv" aria-label="方块小院：浮在云上的小院与方块小精灵"></canvas>
    <div class="hint" id="hint">轻触画面，山里的声音就来了</div>
    <button class="volbtn" type="button" id="btnVol" aria-pressed="false" aria-label="声音开，点击静音" title="点一下静音">
      <svg class="i-on" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4.2 9.4h3.2L12 5.6v12.8L7.4 14.6H4.2z"/><path d="M15.4 8.6a4.8 4.8 0 0 1 0 6.8"/><path d="M17.9 6.2a8.2 8.2 0 0 1 0 11.6"/></svg>
      <svg class="i-off" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4.2 9.4h3.2L12 5.6v12.8L7.4 14.6H4.2z"/><path d="M16.1 9.5l4.4 5"/><path d="M20.5 9.5l-4.4 5"/></svg>
      <span id="volTx">声音开</span>
    </button>
  </main>

  <section class="panel">
    <div class="caption">
      <p id="line">今天风很轻，不用赶路。</p>
      <span class="who" id="lineWho">—— 小方块</span>

    <div class="actions" id="actions">
      <button class="act" type="button" data-act="tea" aria-label="泡杯热茶">

        <span class="bodywrap"><span class="tx">泡杯热茶</span><span class="sub">慢慢喝</span></span>
      </button>
      <button class="act" type="button" data-act="lamp" aria-label="点亮石灯">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 3.4v2.2"/><path d="M7.6 5.8h8.8"/><path d="M9 6.4h6l.9 7.2H8.1z"/><path d="M7.4 13.8h9.2"/><path d="M12 14.6v2.4"/><path d="M8.8 18.6h6.4"/></svg>
        <span class="bodywrap"><span class="tx">点亮石灯</span><span class="sub">夜里更暖</span></span>
      </button>
      <button class="act" type="button" data-act="pet" aria-label="轻抚一下">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 19.3s-6.3-3.9-6.3-8.1A3.35 3.35 0 0 1 12 9.4a3.35 3.35 0 0 1 6.3 1.8c0 4.2-6.3 8.1-6.3 8.1Z"/></svg>
        <span class="bodywrap"><span class="tx">轻抚一下</span><span class="sub">它就安静了</span></span>

        <span class="bodywrap"><span class="tx">陪它打盹</span><span class="sub">一起歇会儿</span></span>
      </button>
      <button class="act" type="button" data-act="note" aria-label="记一句手记">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M6.4 4.4h7.9l3.3 3.3v11.9H6.4z"/><path d="M14.3 4.4v3.3h3.3"/><path d="M9.4 11.2h5.2M9.4 14.4h5.2M9.4 17.2h3"/></svg>
        <span class="bodywrap"><span class="tx">记一句手记</span><span class="sub">写给自己</span></span>
      </button>
    </div>

    <div class="warm">
      <span class="nm" id="stageName">初来的小方块</span>
      <div class="bar" aria-hidden="true"><i id="warmBar"></i></div>
      <span id="warmNum">暖意 0</span>
    </div>

    <div class="links">
      <button class="lnk" type="button" id="btnSheet">手记与设置</button>
      <a href="/">返回 AI早报</a>
    </div>
  </section>
</div>

<div class="sheet" id="sheet" aria-hidden="true">
  <div class="card" role="dialog" aria-label="手记与设置">
    <div style="display:flex;align-items:center;justify-content:space-between">
      <h2>手记与设置</h2>
      <button class="close" type="button" id="closeSheet">收起</button>
    </div>
    <div class="today" id="todayBox"></div>
    <h3>手记</h3>
    <ul id="noteList"></ul>
    <h3>声音</h3>
    <div class="setrow" style="border-top:0;padding-top:0">
      <label><input type="checkbox" id="soundChk" checked> 山里的声音（风、雨、虫、铃）</label>
    </div>
    <h3>存档</h3>
    <div class="setrow">
      <span style="font-size:12px;color:#8b8274">小院存在这台设备的浏览器里</span>
      <button class="ghost" type="button" id="resetBtn">重置小院</button>
    </div>
  </div>
</div>

<div class="dlg" id="noteDlg" aria-hidden="true">
  <div class="box" role="dialog" aria-label="记一句手记">
    <h3>记一句</h3>
    <p>今天想留下什么？一句就好。</p>
    <textarea id="noteText" rows="3" maxlength="90" placeholder="今天的风……"></textarea>
    <div class="dlgbtns">
      <button class="ghost" type="button" id="noteCancel">算了</button>
      <button class="primary" type="button" id="noteSave">收进手记</button>
    </div>
  </div>
</div>

  if(Array.isArray(c)) return c;
  var n=parseInt(c.slice(1),16);

}
function shade(hex,f){
  var c=rgb(hex);
  return 'rgb('+clamp(Math.round(c[0]*f),0,255)+','+clamp(Math.round(c[1]*f),0,255)+','+clamp(Math.round(c[2]*f),0,255)+')';
}
function mixc(a,b,t){
  var A=rgb(a),B=rgb(b);

}

}
function rr(ctx,x,y,w,h,r){
  r=Math.min(r,Math.abs(w)/2,Math.abs(h)/2);
  ctx.beginPath();
  ctx.moveTo(x+r,y);
  ctx.lineTo(x+w-r,y); ctx.quadraticCurveTo(x+w,y,x+w,y+r);
  ctx.lineTo(x+w,y+h-r); ctx.quadraticCurveTo(x+w,y+h,x+w-r,y+h);
  ctx.lineTo(x+r,y+h); ctx.quadraticCurveTo(x,y+h,x,y+h-r);
  ctx.lineTo(x,y+r); ctx.quadraticCurveTo(x,y,x+r,y);
  ctx.closePath();
}
function dayKey(d){
  d=d||new Date();

}

var Snd={

  start:function(){
    if(this.started) return;

    if(!AC) return;
    try{
      this.ctx=new AC();
      this.master=this.ctx.createGain();
      this.master.gain.value=S.muted?0:0.85;
      this.master.connect(this.ctx.destination);
      this.buildAmbient();
      if(this.ctx.state==='suspended'){ try{ this.ctx.resume(); }catch(e){} }
      this.started=true;
    }catch(e){ this.started=false; }
  },
  noiseBuf:function(){
    var c=this.ctx;
    var buf=c.createBuffer(1, c.sampleRate*2, c.sampleRate);
    var d=buf.getChannelData(0);
    for(var i=0;i<d.length;i++) d[i]=Math.random()*2-1;
    return buf;
  },
  buildAmbient:function(){
    var c=this.ctx;
    var buf=this.noiseBuf();
    // 风：低通 + 缓慢阵风
    var src=c.createBufferSource(); src.buffer=buf; src.loop=true;
    var lp=c.createBiquadFilter(); lp.type='lowpass'; lp.frequency.value=520; lp.Q.value=0.6;
    var g=c.createGain(); g.gain.value=0.0;
    src.connect(lp); lp.connect(g); g.connect(this.master); src.start();
    var lfo=c.createOscillator(); lfo.frequency.value=0.055;
    var lfoG=c.createGain(); lfoG.gain.value=0.022;
    lfo.connect(lfoG); lfoG.connect(g.gain); lfo.start();
    g.gain.setTargetAtTime(0.05, c.currentTime, 2.0);
    this.wind=g;
    // 雨：高通
    var src2=c.createBufferSource(); src2.buffer=buf; src2.loop=true;
    var hp=c.createBiquadFilter(); hp.type='highpass'; hp.frequency.value=2200;
    var g2=c.createGain(); g2.gain.value=0;
    src2.connect(hp); hp.connect(g2); g2.connect(this.master); src2.start();
    this.rainGain=g2;
    this.rain=hp;

    if(!this.started) return;

var SCENE_ITEMS=[];
function bake(){
  items.length=0; LIGHTS.length=0;
  buildScene();
  var sorted=items.slice().sort(function(a,b){
    var da=a.x+a.w/2+a.z+a.d/2, db=b.x+b.w/2+b.z+b.d/2;
    if(Math.abs(da-db)>1e-6) return da-db;
    return a.y-b.y;
  });
  sctx.setTransform(1,0,0,1,0,0);
  sctx.clearRect(0,0,scn.width,scn.height);
  setWorld(sctx);
  for(var i=0;i<sorted.length;i++) drawBox(sctx,sorted[i]);
  SCENE_ITEMS=sorted;
}
function poly(c,pts){
  c.beginPath();
  c.moveTo(pts[0][0],pts[0][1]);
  for(var i=1;i<pts.length;i++) c.lineTo(pts[i][0],pts[i][1]);
  c.closePath();
}
function drawBox(c,b){
  var x=b.x,z=b.z,y=b.y,w=b.w,d=b.d,h=b.h;
  var t1=proj(x,z,y+h), t2=proj(x+w,z,y+h), t3=proj(x+w,z+d,y+h), t4=proj(x,z+d,y+h);
  var b1=proj(x,z,y), b2=proj(x+w,z,y), b3=proj(x+w,z+d,y), b4=proj(x,z+d,y);
  // +x 面（右下）
  var colR=shade(b.c,0.74);
  poly(c,[t2,t3,b3,b2]); c.fillStyle=colR; c.fill(); c.strokeStyle=colR; c.lineWidth=0.6; c.stroke();
  // +z 面（左下）
  var colL=shade(b.c,0.9);
  poly(c,[t4,t3,b3,b4]); c.fillStyle=colL; c.fill(); c.strokeStyle=colL; c.stroke();
  // 顶面
  var colT=shade(b.c,1.09);
  poly(c,[t1,t2,t3,t4]); c.fillStyle=colT; c.fill(); c.strokeStyle=colT; c.stroke();
}

/* ================= 6. 小精灵 ================= */
var sp={
  x:6.3, z:5.45, tx:6.3, tz:5.45,
  state:'idle', timer:2.5, speed:0, face:1,
  bob:0, blink:0, blinkT:3, mood:'calm', intent:null,
  sit:0, look:0
};
var ROAM=[[5.35,5.45],[6.2,5.0],[6.85,5.9],[6.2,6.65],[5.6,6.35],[6.95,6.6],[5.95,4.85]];
var CUSHION=[2.95,6.45];
function dist(ax,az,bx,bz){ var dx=ax-bx,dz=az-bz; return Math.sqrt(dx*dx+dz*dz); }
function walkTo(x,z,intent){
  sp.tx=x; sp.tz=z; sp.state='walk'; sp.intent=intent||null;
  sp.face=(x-sp.x)>0?1:-1;
}
function pickIdle(){
  var r=Math.random();
  if(r<0.44){
    var p=ROAM[Math.floor(Math.random()*ROAM.length)];
    walkTo(p[0],p[1],null);
    sp.timer=9;
  }else if(r<0.62){ sp.state='look'; sp.timer=5+Math.random()*4; sp.intent=null; }
  else if(r<0.78){ sp.state='read'; sp.timer=7+Math.random()*6; sp.intent=null; }
  else if(r<0.9){ sp.state='sit'; sp.timer=6+Math.random()*5; sp.intent=null; }
  else { sp.state='nap'; sp.timer=12+Math.random()*10; sp.intent=null; }
}

function updateSpirit(dt,t){
  // 移动
  if(sp.state==='walk'){
    var dx=sp.tx-sp.x, dz=sp.tz-sp.z;
    var d=Math.sqrt(dx*dx+dz*dz);
    if(d<0.05){
      sp.x=sp.tx; sp.z=sp.tz; sp.speed=0;
      if(sp.intent==='tea'){
        sp.state='tea'; sp.intent=null; sp.timer=13; sp.face=-1;
        fxSteam();
      }else{
        sp.state='idle'; sp.timer=2+Math.random()*3;
      }
    }else{
      var v=Math.min(0.52, d*1.4);
      sp.speed=v;
      sp.x+=dx/d*v*dt;
      sp.z+=dz/d*v*dt;
      if(Math.abs(dx)>0.02) sp.face=dx>0?1:-1;
    }
  }else{
    sp.speed=0;
    sp.timer-=dt;
    if(sp.timer<=0) pickIdle();
  }
  // 眨眼
  sp.blinkT-=dt;
  if(sp.blinkT<=0){ sp.blink=0.14; sp.blinkT=2.6+Math.random()*3.4; }
  if(sp.blink>0) sp.blink-=dt;
  // 呼吸浮动
  sp.bob=Math.sin(t*0.9)*2.2;
}

/* ---- 画小精灵 ---- */
function drawSpirit(g,t){
  var p=proj(sp.x,sp.z,0.42);
  var px=p[0], py=p[1]+sp.bob;
  g.save();
  g.translate(px,py); g.scale(0.92,0.92); g.translate(-px,-py);
  var walking=sp.state==='walk';
  var sitting=sp.state==='sit'||sp.state==='tea';
  var sleeping=sp.state==='nap';
  var petting=sp.state==='pet';
  var reading=sp.state==='read';
  var S1=sitting?0.94:1;

  var bw=52*S1, bh=46*S1;
  if(sitting) py+=6;
  var dxv=12, dyv=9;

  // 影子
  g.save();
  g.globalAlpha=0.20;
  g.fillStyle='#2a2a22';
  g.beginPath();
  g.ellipse(px+2, p[1]+7, 26*S1, 8*S1, 0, 0, Math.PI*2);
  g.fill();
  g.restore();

  // 触手
  var sway=walking?3.2:1.6;
  for(var i=0;i<5;i++){
    var ox=-21+i*10.5;
    var ph=t*1.15+i*0.9;
    var sw=Math.sin(ph)*sway;
    var len=(13+((i%2)*5))*S1;
    var x0=px+ox*S1;
    var y0=py-2;
    g.fillStyle= i%2===0 ? '#efe5d3' : '#e7dcc8';
    g.beginPath();
    g.moveTo(x0-3.4*S1, y0);
    g.lineTo(x0+3.4*S1, y0);
    g.quadraticCurveTo(x0+3.0*S1+sw*0.6, y0+len*0.6, x0+sw*1.2, y0+len);
    g.quadraticCurveTo(x0-3.0*S1+sw*0.6, y0+len*0.6, x0-3.2*S1, y0);
    g.closePath(); g.fill();
    g.fillStyle='rgba(190,175,150,.55)';
    g.beginPath();
    g.ellipse(x0+sw*1.1, y0+len-1.6*S1, 3.2*S1, 2.2*S1, 0, 0, Math.PI*2);
    g.fill();
  }

  var top=py-bh;

  // 顶部面
  g.fillStyle='#fbf5e8';
  poly(g,[[px-bw/2,top],[px+bw/2,top],[px+bw/2+dxv,top-dyv],[px-bw/2+dxv,top-dyv]]);
  g.fill();
  // 右侧面
  g.fillStyle='#ded1bd';
  poly(g,[[px+bw/2,top],[px+bw/2+dxv,top-dyv],[px+bw/2+dxv,py-dyv],[px+bw/2,py]]);
  g.fill();
  // 正面
  var grd=g.createLinearGradient(0,top,0,py);
  grd.addColorStop(0,'#f7f0e2');
  grd.addColorStop(1,'#ece1cc');
  g.fillStyle=grd;
  rr(g,px-bw/2,top,bw,bh,7*S1);
  g.fill();

  // 护目镜带（额前）
  g.fillStyle='#6d4a2f';
  rr(g,px-bw/2+1,top+2.4*S1,bw-2,8*S1,3*S1); g.fill();
  g.fillStyle='#7d5838';
  poly(g,[[px-bw/2+1,top+2.4*S1],[px+bw/2-1,top+2.4*S1],[px+bw/2-1+dxv,top+2.4*S1-dyv],[px-bw/2+1+dxv,top+2.4*S1-dyv]]);
  g.fill();

  // 护目镜镜片
  var lensY=top-2.5*S1;
  var lensS=19*S1;
  drawLens(g, px-13*S1, lensY, lensS, lensS*0.92, S1);
  drawLens(g, px+13*S1, lensY, lensS, lensS*0.92, S1);

  // 面罩与眼睛
  g.fillStyle='#262b33';
  rr(g,px-24*S1,top+13*S1,48*S1,20*S1,5*S1); g.fill();

  var eyeGlow = 1;
  if(sleeping || petting){
    g.strokeStyle='#8fe4e8'; g.lineWidth=2.4*S1; g.lineCap='round';
    g.beginPath(); g.moveTo(px-18*S1,top+23*S1); g.lineTo(px-8*S1,top+23*S1); g.stroke();
    g.beginPath(); g.moveTo(px+8*S1,top+23*S1); g.lineTo(px+18*S1,top+23*S1); g.stroke();
  }else if(sp.blink>0){
    g.strokeStyle='#8fe4e8'; g.lineWidth=2.4*S1; g.lineCap='round';
    g.beginPath(); g.moveTo(px-18*S1,top+24*S1); g.lineTo(px-8*S1,top+24*S1); g.stroke();
    g.beginPath(); g.moveTo(px+8*S1,top+24*S1); g.lineTo(px+18*S1,top+24*S1); g.stroke();
  }else{
    g.save();
    g.shadowColor='rgba(120,230,235,'+(0.75*eyeGlow)+')';
    g.shadowBlur=9*S1;
    g.fillStyle='#a8f0f2';
    // 左眼
    g.beginPath();
    g.moveTo(px-19*S1,top+19.5*S1);

  // 嘴

  // 腮边小方块
  g.fillStyle='rgba(206,190,166,.55)';
  g.fillRect(px-22*S1, top+31*S1, 3.2*S1, 3.2*S1);
  g.fillRect(px+18.8*S1, top+31*S1, 3.2*S1, 3.2*S1);

  // 围巾（暖意 42 起）
  if(S.warmth>=42){
    g.fillStyle='#7f8f63';
    rr(g,px-bw/2+1, py-7*S1, bw-2, 6*S1, 2.5*S1); g.fill();
    g.fillStyle='#71815a';
    rr(g,px+bw/2-9*S1, py-4*S1, 6*S1, 12*S1, 2.5*S1); g.fill();

    g.fillStyle='#8d6b46';
    g.fillRect(hx-5*S1,hy-8*S1,10*S1,2.2*S1);
    g.fillRect(hx-5*S1,hy+4.6*S1,10*S1,1.8*S1);
  }

  // 看书
  if(reading){
    var bx=px-13*S1, by=py-4*S1;

function drawLens(g,cx,cy,w,h,S1){

function spawnLeaf(){

}

  }
}

  }
}
function fxSparks(){
  for(var i=0;i<14;i++){
    P.sparks.push({life:0,max:1.2+Math.random()*1.1,dx:(Math.random()-0.5)*34,dy:-6-Math.random()*26,ph:Math.random()*6.28});
  }
}

function updateParticles(dt,t){
  var i,p;
  // 落叶
  if(!reduce){
    if(Math.random()<dt*0.4*LEAFRATE && P.leaves.length<14) spawnLeaf();
    for(i=P.leaves.length-1;i>=0;i--){
      p=P.leaves[i];
      p.y+=p.v*dt;
      p.x+=Math.sin(t*0.9+p.ph)*16*dt;
      p.r+=p.vr*dt;
      if(p.y>p.gy) P.leaves.splice(i,1);
    }
  }
  // 爱心
  for(i=P.hearts.length-1;i>=0;i--){
    p=P.hearts[i]; p.life+=dt;
    if(p.life>p.max) P.hearts.splice(i,1);
  }
  // 茶烟
  for(i=P.steam.length-1;i>=0;i--){
    p=P.steam[i]; p.life+=dt;
    if(p.life>p.max) P.steam.splice(i,1);
  }
  // 灯光火星
  for(i=P.sparks.length-1;i>=0;i--){
    p=P.sparks[i]; p.life+=dt;
    if(p.life>p.max) P.sparks.splice(i,1);
  }
  // 雨
  var wantRain = W.rain ? (mobile?70:110) : 0;
  while(P.rain.length<wantRain) P.rain.push({x:Math.random()*CW,y:Math.random()*CH,l:6+Math.random()*10,v:280+Math.random()*160,a:0.16+Math.random()*0.2});
  while(P.rain.length>wantRain) P.rain.pop();
  for(i=0;i<P.rain.length;i++){
    p=P.rain[i]; p.y+=p.v*dt; p.x+=46*dt;
    if(p.y>CH+10){ p.y=-12; p.x=Math.random()*CW; }
    if(p.x>CW+10) p.x=-10;
  }
  // 雪
  var wantSnow = W.snow ? (mobile?60:100) : 0;
  while(P.snow.length<wantSnow) P.snow.push({x:Math.random()*CW,y:Math.random()*CH,r:0.8+Math.random()*1.9,v:10+Math.random()*22,ph:Math.random()*6.28});
  while(P.snow.length>wantSnow) P.snow.pop();
  for(i=0;i<P.snow.length;i++){
    p=P.snow[i]; p.ph+=dt*0.8;
    p.y+=p.v*dt; p.x+=Math.sin(p.ph)*10*dt;
    if(p.y>CH+6){ p.y=-6; p.x=Math.random()*CW; }
  }
  // 萤火虫
  var wantFly = pal.night>0.45 ? (mobile?7:11) : 0;
  while(P.flies.length<wantFly){
    P.flies.push({x:2+Math.random()*6,z:2+Math.random()*6,ph:Math.random()*6.28,sp:0.3+Math.random()*0.5});
  }
  while(P.flies.length>wantFly) P.flies.pop();
  // 浮尘
  var wantMote = (1-pal.night)*(W.mist>0.5?26:14);
  while(P.motes.length<wantMote) P.motes.push({x:Math.random()*CW,y:Math.random()*CH,r:0.6+Math.random()*1.4,v:3+Math.random()*6,ph:Math.random()*6.28});
  while(P.motes.length>wantMote) P.motes.pop();
  for(i=0;i<P.motes.length;i++){
    p=P.motes[i]; p.ph+=dt*0.5;
    p.y-=p.v*dt; p.x+=Math.sin(p.ph)*4*dt;
    if(p.y<-4){ p.y=CH+4; p.x=Math.random()*CW; }
  }
}

function drawSky(t){
  var g=ctx.createLinearGradient(0,0,0,CH*1.02);
  g.addColorStop(0,css(pal.top));
  g.addColorStop(0.55,css(mixc(pal.top,pal.bot,0.62)));
  g.addColorStop(1,css(pal.bot));
  ctx.fillStyle=g;
  ctx.fillRect(0,0,CW,CH);

  // 夜空星子
  if(pal.night>0.05){
    for(var i=0;i<stars.length;i++){
      var s=stars[i];
      var tw=0.55+0.45*Math.sin(t*1.3+s.ph);
      ctx.globalAlpha=clamp(pal.night*1.2,0,1)*tw*0.85;
      ctx.fillStyle='#eef4ff';
      ctx.fillRect(s.x*CW, s.y*CH, s.r, s.r);
    }
    ctx.globalAlpha=1;
  }
  // 日/月
  var h=nowHours();
  var isDay = h>5.4 && h<18.4;
  var prog = isDay ? (h-5.4)/13 : ((h<5.4? h+24-18.4 : h-18.4)/11);
  prog=clamp(prog,0,1);
  var sx=lerp(CW*0.1,CW*0.9,prog);
  var sy=CH*(0.62-0.42*Math.sin(Math.PI*prog));
  var col = isDay ? '#fff3cf' : '#e8f1ff';
  var glow = isDay ? 'rgba(255,236,190,' : 'rgba(220,235,255,';
  var rad = isDay?21:15;
  var ga=ctx.createRadialGradient(sx,sy,1,sx,sy,rad*6);
  ga.addColorStop(0,glow+(isDay?0.5:0.32)+')');
  ga.addColorStop(0.4,glow+(isDay?0.14:0.09)+')');
  ga.addColorStop(1,glow+'0)');
  ctx.fillStyle=ga;
  ctx.beginPath(); ctx.arc(sx,sy,rad*6,0,Math.PI*2); ctx.fill();
  ctx.fillStyle=col;
  ctx.globalAlpha=isDay?0.9:0.85;
  ctx.beginPath(); ctx.arc(sx,sy,rad,0,Math.PI*2); ctx.fill();
  ctx.globalAlpha=1;
}

var lampLevel=S.lampOn?1:0, lampTarget=S.lampOn?1:0;
function drawLampLight(g,t){
  var lp=proj(LAMP.x,LAMP.z,LAMP.y);
  var nightBoost=0.35+pal.night*0.85;
  var flick=0.94+0.06*Math.sin(t*3.1)+0.03*Math.sin(t*7.7);
  var inten=lampLevel*nightBoost*flick;
  if(inten<=0.01) return;
  g.save();
  g.globalCompositeOperation='lighter';
  var R=70;
  var ga=g.createRadialGradient(lp[0],lp[1],2,lp[0],lp[1],R);
  ga.addColorStop(0,'rgba(255,214,146,'+(0.55*inten)+')');
  ga.addColorStop(0.35,'rgba(255,190,110,'+(0.22*inten)+')');
  ga.addColorStop(1,'rgba(255,180,90,0)');
  g.fillStyle=ga;
  g.beginPath(); g.arc(lp[0],lp[1],R,0,Math.PI*2); g.fill();
  // 灯箱里的纸窗
  g.globalCompositeOperation='source-over';
  var bx=LBOX.x, bz=LBOX.z, bw=LBOX.w, by=LBOX.y, bh=LBOX.h;
  g.fillStyle='rgba(255,224,164,'+(0.62*lampLevel)+')';
  poly(g,[proj(bx,bz+bw,by+bh),proj(bx+bw,bz+bw,by+bh),proj(bx+bw,bz+bw,by),proj(bx,bz+bw,by)]);
  g.fill();
  g.fillStyle='rgba(255,236,196,'+(0.34*lampLevel)+')';
  poly(g,[proj(bx+bw,bz,by+bh),proj(bx+bw,bz+bw,by+bh),proj(bx+bw,bz+bw,by),proj(bx+bw,bz,by)]);
  g.fill();
  g.restore();
}

function drawChime(g,t){
  var base=proj(CHIME.x,CHIME.z,CHIME.y);
  var sway=Math.sin(t*1.25)*0.06+chimeImpulse*Math.sin(t*9)*0.5;
  var len=0.62;
  for(var i=0;i<3;i++){
    var off=(i-1)*7;
    var ang=sway*(0.8+i*0.15);
    var ex=base[0]+off+Math.sin(ang)*len*YU*0.5;
    var ey=base[1]+Math.cos(ang)*len*YU;
    g.strokeStyle='rgba(90,80,66,.55)';
    g.lineWidth=0.9;
    g.beginPath(); g.moveTo(base[0]+off,base[1]); g.lineTo(ex,ey); g.stroke();
    // 玻璃管
    var col=i===1?'#dfeef2':'#eef3ea';
    g.fillStyle=col;
    rr(g,ex-2.6,ey-2,5.2,15+i*2,2.6); g.fill();
    g.fillStyle='rgba(255,255,255,.7)';
    g.fillRect(ex-1.4,ey,1.2,8);
    g.fillStyle='#b9ac93';
    rr(g,ex-3.4,ey-4.4,6.8,2.4,1.2); g.fill();
  }
}

function drawParticlesWorld(g,t){
  var i,p;

  for(i=0;i<P.leaves.length;i++){
    p=P.leaves[i];
    g.save();
    g.translate(p.x,p.y); g.rotate(p.r);
    g.fillStyle=p.c;

    g.restore();
  }
  // 爱心
  for(i=0;i<P.hearts.length;i++){
    p=P.hearts[i];
    var k=p.life/p.max;
    var hp=proj(sp.x,sp.z,1.55);
    var hx=hp[0]+p.dx*k+Math.sin(t*2+p.ph)*4;
    var hy=hp[1]-k*38;
    g.save();
    g.globalAlpha=(1-k)*0.85;
    g.fillStyle='#e0a08a';
    g.beginPath();
    g.moveTo(hx,hy+4);
    g.quadraticCurveTo(hx-6,hy-2,hx,hy-6);
    g.quadraticCurveTo(hx+6,hy-2,hx,hy+4);
    g.fill();
    g.restore();
  }
  // 茶烟
  for(i=0;i<P.steam.length;i++){
    p=P.steam[i];
    if(p.x===0&&p.y===0){
      var tp=proj(3.1,5.42,1.06);
      p.x=tp[0]+ (Math.random()-0.5)*6; p.y=tp[1];
    }
    var k2=p.life/p.max;
    var sy2=p.y-k2*46;

    g.fillStyle=sg;

  }
  // 灯火火星
  for(i=0;i<P.sparks.length;i++){
    p=P.sparks[i];
    var k3=p.life/p.max;
    var lp2=proj(LAMP.x,LAMP.z,LAMP.y);
    var px2=lp2[0]+p.dx*k3+Math.sin(k3*5+p.ph)*3;
    var py2=lp2[1]+p.dy*k3;

    g.globalAlpha=(1-k3)*0.7;
    g.fillStyle='#ffd79a';

    g.restore();
  }
  // 萤火虫
  for(i=0;i<P.flies.length;i++){
    p=P.flies[i];
    p.ph+=0.012;
    var fp=proj(p.x+Math.sin(p.ph*1.3)*0.5, p.z+Math.cos(p.ph)*0.5, 0.7+0.35*Math.sin(p.ph*0.8));
    var a=0.35+0.3*Math.sin(t*2+p.ph);
    g.save();
    g.globalCompositeOperation='lighter';
    var fg=g.createRadialGradient(fp[0],fp[1],0,fp[0],fp[1],9);
    fg.addColorStop(0,'rgba(220,255,190,'+a+')');
    fg.addColorStop(1,'rgba(200,255,170,0)');
    g.fillStyle=fg;
    g.beginPath(); g.arc(fp[0],fp[1],9,0,Math.PI*2); g.fill();
    g.restore();
  }
}

    var a=W.mist*0.10;
    var mg=ctx.createLinearGradient(0,CH*0.60,0,CH*1.0);
    mg.addColorStop(0,'rgba(255,255,255,0)');
    mg.addColorStop(0.5,'rgba(255,255,255,'+a+')');
    mg.addColorStop(1,'rgba(255,255,255,0)');
    ctx.fillStyle=mg;
    ctx.fillRect(0,CH*0.60,CW,CH*0.40);
  }
  // 暗角
  var vg=ctx.createRadialGradient(CW/2,CH*0.46,Math.min(CW,CH)*0.28,CW/2,CH*0.5,Math.max(CW,CH)*0.78);
  vg.addColorStop(0,'rgba(40,35,26,0)');
  vg.addColorStop(1,'rgba(40,35,26,0.10)');
  ctx.fillStyle=vg;
  ctx.fillRect(0,0,CW,CH);
}

function render(t){
  var h=nowHours();
  pal=palAt(h);
  setScreen(ctx);
  ctx.clearRect(0,0,CW,CH);
  drawSky(t);
  drawFar(t);
  drawHills(t);
  drawSkyClouds(t);

  // 世界层
  wctx.setTransform(1,0,0,1,0,0);
  wctx.clearRect(0,0,wc.width,wc.height);
  wctx.drawImage(scn,0,0,wc.width,wc.height);
  setWorld(wctx);
  drawChime(wctx,t);
  drawSpiritGlow(wctx,t);
  drawSpirit(wctx,t);
  drawParticlesWorld(wctx,t);

  // 统一的夜色染色（只作用于世界层）
  wctx.setTransform(1,0,0,1,0,0);
  wctx.globalCompositeOperation='source-atop';
  wctx.fillStyle='rgba('+pal.tint[0]+','+pal.tint[1]+','+pal.tint[2]+','+pal.ta.toFixed(3)+')';
  wctx.fillRect(0,0,wc.width,wc.height);
  // 日间的暖光从左上斜进来
  if(pal.night<0.75){
    setWorld(wctx);
    var wg=wctx.createRadialGradient(-150,-90,10,-150,-90,430);
    wg.addColorStop(0,'rgba(255,228,178,'+(0.055*(1-pal.night))+')');
    wg.addColorStop(1,'rgba(255,228,178,0)');
    wctx.fillStyle=wg;
    wctx.fillRect(-280,-200,620,560);
  }
  wctx.setTransform(1,0,0,1,0,0);
  wctx.globalCompositeOperation='source-over';
  // 灯光在夜色之后叠加，才有暖意
  setWorld(wctx);
  drawLampLight(wctx,t);
  drawStringLights(wctx,t);

  setScreen(ctx);
  ctx.drawImage(wc,0,0,CW,CH);
  drawScreenFx(t);
}

/* ================= 9. 主循环 ================= */
var lastT=0, acc=0, aliveT=0, lastSave=0;
function frame(ms){
  var t=ms/1000;
  if(!lastT) lastT=t;
  var dt=Math.min(0.06, t-lastT);
  lastT=t;
  if(!document.hidden){
    aliveT+=dt;
    updateSpirit(dt,t);
    updateParticles(dt,t);
    if(lampLevel!==lampTarget){
      var dir=lampTarget>lampLevel?1:-1;
      lampLevel=clamp(lampLevel+dir*dt*0.55,0,1);
    }
    if(chimeImpulse>0) chimeImpulse=Math.max(0,chimeImpulse-dt*0.75);
    // 陪伴时光
    acc+=dt;
    if(acc>=60){ acc-=60; S.warmth+=1; S.seconds+=60; refreshWarm(); save(); }
    else { S.seconds+=dt; }
    if(t-lastSave>25){ lastSave=t; save(); }
    // 虫鸣
    if(t>Snd.bugT){ Snd.bugT=t+1.6+Math.random()*3.2; Snd.bug(); }
    render(t);
  }
  requestAnimationFrame(frame);
}

/* ================= 10. 界面 ================= */
function titleOf(){
  var n=TITLES[0].name;
  for(var i=0;i<TITLES.length;i++) if(S.warmth>=TITLES[i].at) n=TITLES[i].name;
  return n;
}
function refreshWarm(){
  var next=null, prev=null;
  for(var i=0;i<DECOR.length;i++){
    if(S.warmth<DECOR[i].at){ next=DECOR[i]; break; }
    prev=DECOR[i];
  }
  var a=prev?prev.at:0, b=next?next.at:a+80;
  var p=next?clamp((S.warmth-a)/(b-a),0,1):1;
  $('#warmBar').style.width=(p*100).toFixed(1)+'%';
  $('#warmNum').textContent='暖意 '+Math.floor(S.warmth);
  $('#stageName').textContent=titleOf();
  $('#chipDay').textContent='第 '+S.streak+' 天';
}
var sayTimer=null;
function say(text,who){
  var p=$('#line'), w=$('#lineWho');
  clearTimeout(sayTimer);
  p.style.opacity='0';
  sayTimer=setTimeout(function(){
    p.textContent=text;
    w.textContent=(who===undefined?'—— 小方块':who);
    p.style.opacity='1';
  },200);
}
function pick(arr){ return arr[Math.floor(Math.random()*arr.length)]; }

function checkUnlocks(){
  var got=[];
  for(var i=0;i<DECOR.length;i++){
    var d=DECOR[i];
    if(S.warmth>=d.at && S.unlocked.indexOf(d.id)<0){
      S.unlocked.push(d.id);
      got.push(d);
    }
  }
  if(got.length){
    bake();
    var d2=got[got.length-1];
    say(d2.line,'—— 院子里多了一样：'+d2.name);
    Snd.unlock();
    save(true);
    refreshWarm();
    return true;
  }
  refreshWarm();
  return false;
}

function addWarmth(n,text,who){
  S.warmth+=n;
  save();
  refreshWarm();
  var didUnlock=checkUnlocks();
  if(text && !didUnlock) say(text,who);
}

/* 互动 */
var busy={};
function canAct(k){
  if(busy[k]&&Date.now()-busy[k]<700) return false;
  busy[k]=Date.now();
  return true;
}
function act(name){
  Snd.start();
  hideHint();
  if(name==='tea'){
    if(!canAct('tea')) return;
    S.tea=(S.tea||0)+1;
    walkTo(CUSHION[0],CUSHION[1],'tea');
    Snd.tea();
    setTimeout(fxSteam,600);
    addWarmth(5,pick(SAY.tea));
  }else if(name==='lamp'){
    if(!canAct('lamp')) return;
    S.lampOn=!S.lampOn;
    lampTarget=S.lampOn?1:0;
    if(S.lampOn){
      S.lampCount=(S.lampCount||0)+1;
      Snd.bell();
      fxSparks();
      addWarmth(6,pick(SAY.lamp));
    }else{
      Snd.soft(392,330);
      addWarmth(0,pick(SAY.lampoff));
    }
    save(true);
  }else if(name==='pet'){
    if(!canAct('pet')) return;
    sp.state='pet'; sp.timer=3.2; sp.intent=null;
    fxHearts();
    Snd.soft(392,523);
    var w=(S.warmth>=180)?'这院子的光，好像都是你带进来的。':pick(SAY.pet);
    addWarmth(3,w);
  }else if(name==='chime'){
    if(!canAct('chime')) return;
    S.chimes=(S.chimes||0)+1;
    chimeImpulse=1;
    Snd.chime();
    sp.state='look'; sp.timer=3;
    addWarmth(4,pick(SAY.chime));
  }else if(name==='nap'){
    if(!canAct('nap')) return;
    walkTo(4.15,6.85,'nap');
    addWarmth(4,null);
    say(pick(SAY.nap));
    setTimeout(function(){ sp.state='nap'; sp.timer=22; Snd.soft(330,262); },1200);
  }else if(name==='note'){
    if(!canAct('note')) return;
    openNote();
  }
}

/* 手记 */
function openNote(){
  $('#noteDlg').classList.add('on');
  $('#noteDlg').setAttribute('aria-hidden','false');
  var ta=$('#noteText');
  ta.value='';
  setTimeout(function(){ try{ ta.focus(); }catch(e){} },180);
}
function closeNote(){
  $('#noteDlg').classList.remove('on');
  $('#noteDlg').setAttribute('aria-hidden','true');
}
function saveNote(){
  var ta=$('#noteText');
  var v=(ta.value||'').trim();
  if(!v){ closeNote(); return; }
  if(v.length>90) v=v.slice(0,90);
  S.notes.unshift({d:TODAY,t:v});
  if(S.notes.length>120) S.notes.length=120;
  save(true);
  closeNote();
  Snd.soft(660,784);
  addWarmth(8,pick(SAY.note));
  renderNotes();
}
function renderNotes(){
  var ul=$('#noteList');
  ul.innerHTML='';
  if(!S.notes.length){
    var li=document.createElement('li');
    li.className='empty';
    li.textContent='还没有手记。今天想写下什么？';
    ul.appendChild(li);
    return;
  }
  for(var i=0;i<S.notes.length;i++){
    var n=S.notes[i];
    var li2=document.createElement('li');
    li2.textContent=n.t;
    var s=document.createElement('span');
    s.textContent=n.d;
    li2.appendChild(s);
    ul.appendChild(li2);
  }
}
function openSheet(){
  var box=$('#todayBox');
  var mins=Math.floor(S.seconds/60);
  var decN=S.unlocked.length;
  box.innerHTML=
    '<div><b>今天</b><span>'+TODAY+'</span></div>'+
    '<div><b>天气</b><span>'+W.name+' · '+periodName(nowHours())+'</span></div>'+
    '<div><b>相伴</b><span>'+S.streak+' 天</span></div>'+
    '<div><b>暖意</b><span>'+Math.floor(S.warmth)+'</span></div>'+
    '<div><b>累计</b><span>'+mins+' 分钟</span></div>'+
    '<div><b>雅物</b><span>'+decN+' / '+DECOR.length+'</span></div>'+
    '<div><b>点灯</b><span>'+(S.lampCount||0)+' 次</span></div>'+
    '<div><b>茶</b><span>'+(S.tea||0)+' 杯</span></div>';
  renderNotes();
  $('#sheet').classList.add('on');
  $('#sheet').setAttribute('aria-hidden','false');
}
function closeSheet(){
  $('#sheet').classList.remove('on');
  $('#sheet').setAttribute('aria-hidden','true');
}

/* 提示 */
var hintGone=false;
function hideHint(){
  if(hintGone) return;
  hintGone=true;
  var el=$('#hint');
  el.classList.add('gone');
  setTimeout(function(){ if(el.parentNode) el.parentNode.removeChild(el); },900);
}

/* 尺寸 */
function resize(){
  var st=$('#stage');
  var r=st.getBoundingClientRect();
  CW=Math.max(220,Math.round(r.width));
  CH=Math.max(180,Math.round(r.height));
  DPR=Math.min(window.devicePixelRatio||1,2);
  cv.width=Math.round(CW*DPR);
  cv.height=Math.round(CH*DPR);
  cv.style.width=CW+'px';
  cv.style.height=CH+'px';
  var vw=VB.x1-VB.x0, vh=VB.y1-VB.y0;
  var cy0=-36, cy1=272;
  SC=Math.min(CW/vw, CH/((cy1-cy0)+44));
  OX=CW/2 - ((VB.x0+VB.x1)/2)*SC;
  OY=(CH-(cy1-cy0)*SC)/2 - cy0*SC;
  scn.width=Math.round(CW*DPR);
  scn.height=Math.round(CH*DPR);
  wc.width=scn.width;
  wc.height=scn.height;
  bake();
}

/* ================= 11. 启动 ================= */
function initDay(){
  var last=S.lastDay||'';
  if(last!==TODAY){
    if(last===shiftDay(TODAY,-1)) S.streak=(S.streak||1)+1;
    else S.streak=1;
    S.lastDay=TODAY;
    S.visits=(S.visits||0)+1;
    S.warmth+=6;           // 今日相见
    save(true);
  }else{
    if(!S.streak) S.streak=1;
    if(!S.lastDay) S.lastDay=TODAY;
  }
}

function boot(){
  initDay();
  resize();
  // 界面上先把日期线放好
  $('#chipTime').textContent=periodName(nowHours());
  $('#chipWx').textContent=W.name;
  $('#line').textContent=DAILYLINE;
  refreshWarm();
  renderNotes();
  setInterval(function(){
    $('#chipTime').textContent=periodName(nowHours());
  },60000);
  if(S.lampOn) lampTarget=1;

  Snd.setWeather= Snd.setWeather.bind(Snd);

  // 事件
  $('#actions').addEventListener('click',function(e){
    var b=e.target.closest ? e.target.closest('.act') : null;
    if(!b) return;
    act(b.getAttribute('data-act'));
  });
  cv.addEventListener('pointerdown',function(e){
    Snd.start(); hideHint();
    var r=cv.getBoundingClientRect();
    var wx=(e.clientX-r.left-OX)/SC;
    var wy=(e.clientY-r.top-OY)/SC;
    var pp=proj(sp.x,sp.z,0.9);
    if(Math.abs(wx-pp[0])<52 && Math.abs(wy-pp[1])<56){
      act('pet');
    }
  });
  document.addEventListener('pointerdown',function once(){
    Snd.start(); hideHint();
    document.removeEventListener('pointerdown',once);
    if(Snd.started) Snd.setWeather(W);
  },{passive:true});

  $('#btnSheet').addEventListener('click',function(){ Snd.start(); openSheet(); });
  $('#closeSheet').addEventListener('click',closeSheet);
  $('#sheet').addEventListener('click',function(e){ if(e.target===$('#sheet')) closeSheet(); });
  $('#noteCancel').addEventListener('click',closeNote);
  $('#noteSave').addEventListener('click',saveNote);
  $('#noteDlg').addEventListener('click',function(e){ if(e.target===$('#noteDlg')) closeNote(); });
  document.addEventListener('keydown',function(e){
    if(e.key==='Escape'){ closeNote(); closeSheet(); }
  });
  $('#soundChk').addEventListener('change',function(){
    setMuted(!$('#soundChk').checked);
  });
  if(volBtn){
    volBtn.addEventListener('click',function(e){
      e.preventDefault();
      var m=setMuted(!S.muted);
      if(!m) hideHint();
    });
  }
  paintVol();

  var resetArmed=false, resetT=null;
  $('#resetBtn').addEventListener('click',function(){
    var b=$('#resetBtn');
    if(!resetArmed){
      resetArmed=true;
      b.classList.add('warn');
      b.textContent='再点一次就重来';
      clearTimeout(resetT);
      resetT=setTimeout(function(){
        resetArmed=false; b.classList.remove('warn'); b.textContent='重置小院';
      },5000);
    }else{
      clearTimeout(resetT);
      try{ localStorage.removeItem(KEY); }catch(e){}
      S=loadState();
      S.lastDay=TODAY; S.streak=1; S.visits=1; S.warmth=6;
      save(true);
      paintVol();
      if(Snd.started){ Snd.mute(S.muted); if(!S.muted) Snd.setWeather(W); }
      lampLevel=0; lampTarget=0;
      b.classList.remove('warn'); b.textContent='重置小院';
      resetArmed=false;
      bake();
      refreshWarm();
      renderNotes();
      closeSheet();
      say('小院回到最初的样子了。','—— 没关系，可以再来一次');
      Snd.soft(523,392);
    }
  });

  // 打开声音的小提示
  if(!S.muted){
    setTimeout(function(){ if(!hintGone) hideHint(); },9000);
  }

  // 定时刷新今日线
  setInterval(function(){
    $('#chipWx').textContent=W.name;
  },300000);

  // 偶发的一句轻声
  var idleT=0;
  setInterval(function(){
    if(document.hidden) return;
    idleT+=1;
    if(idleT>38 && Math.random()<0.5){
      idleT=0;
      if(sp.state!=='pet'&&sp.state!=='tea'&&sp.state!=='nap'){
        say(pick(SAY.idle));
      }
    }
  },1000);

  // 调整尺寸
  var rt=null;
  window.addEventListener('resize',function(){
    clearTimeout(rt);
    rt=setTimeout(function(){
      mobile=window.matchMedia('(max-width: 700px)').matches;
      resize();
    },160);
  });
  if(window.visualViewport){
    window.visualViewport.addEventListener('resize',function(){
      clearTimeout(rt);
      rt=setTimeout(resize,200);
    });
  }

  requestAnimationFrame(frame);
}

if(document.readyState==='loading'){
  document.addEventListener('DOMContentLoaded',boot);
}else{
  boot();
}

})();
</script>
</body>
