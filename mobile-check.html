<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<title>窄屏预览（临时）</title>
<style>
  body { margin: 0; background: #2B2B2B; font-family: -apple-system, "PingFang SC", sans-serif; }
  .stage { display: flex; gap: 48px; padding: 40px 48px; align-items: flex-start; }
  .phone { width: 390px; background: #fff; border-radius: 22px; overflow: hidden; box-shadow: 0 18px 50px rgba(0,0,0,.45); }
  .phone .bar { display: flex; justify-content: space-between; padding: 8px 16px; font-size: 11px; color: #666; background: #fff; border-bottom: 1px solid #eee; }
  .phone iframe { width: 390px; height: 844px; border: 0; display: block; }
  .caption { color: #EDEAE1; font-size: 13px; letter-spacing: .06em; margin: 12px 0 0; }
  .col { display: flex; flex-direction: column; }
  #report { color: #EDEAE1; font-size: 13px; line-height: 1.9; max-width: 520px; }
  #report b { color: #FFD9A0; font-weight: 600; }
</style>
</head>
<body>
<div class="stage">
  <div class="col">
    <div class="phone">
      <div class="bar"><span>9:41</span><span>AI早报</span><span>100%</span></div>
      <iframe id="m390" src="./index.html" title="390px 预览"></iframe>
    </div>
    <p class="caption">390 × 844 · iPhone 14 宽度</p>
  </div>
  <div class="col">
    <div id="report">测量中…</div>
  </div>
</div>
<script>
  const f = document.getElementById('m390');
  f.addEventListener('load', () => {
    try {
      const d = f.contentDocument, w = f.contentWindow;
      const sw = d.documentElement.scrollWidth, cw = d.documentElement.clientWidth;
      const wide = [...d.querySelectorAll('body *')]
        .filter(el => el.getBoundingClientRect().right > cw + 1)
        .slice(0, 5)
        .map(el => el.tagName.toLowerCase() + (el.className ? '.' + String(el.className).split(' ')[0] : ''));
      document.getElementById('report').innerHTML =
        '<b>视口宽</b> ' + cw + 'px<br>' +
        '<b>文档 scrollWidth</b> ' + sw + 'px<br>' +
        '<b>横向溢出</b> ' + (sw > cw ? '有（' + (sw - cw) + 'px）' : '无') + '<br>' +
        '<b>超宽元素</b> ' + (wide.length ? wide.join(', ') : '无') + '<br>' +
        '<b>内联滚动容器</b> ' + ([...d.querySelectorAll('body *')].filter(e => e.scrollWidth > e.clientWidth + 1).length) + ' 个';
    } catch (e) {
      document.getElementById('report').textContent = 'error: ' + e.message;
    }
  });
</script>
</body>
</html>
